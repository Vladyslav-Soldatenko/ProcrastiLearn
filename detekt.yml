build:
    maxIssues: 0
    excludeCorrectable: false

complexity:
    LongMethod:
        ignoreAnnotated: ['Composable']
    LongParameterList:
        ignoreDefaultParameters: true
        ignoreAnnotated: ['Composable']
    TooManyFunctions:
        thresholdInClasses: 20
    CognitiveComplexMethod:
        active: true
        threshold: 15
    StringLiteralDuplication:
        active: true
        threshold: 3
    MethodOverloading:
        active: true
    NestedScopeFunctions:
        active: true
    ReplaceSafeCallChainWithRun:
        active: true
    ComplexInterface:
        active: true
        # Room @Dao interfaces legitimately accumulate many small single-purpose query methods;
        # match the TooManyFunctions.thresholdInClasses tuning above instead of forcing DAO splits.
        threshold: 20
    # LabeledExpression intentionally left at detekt's default (inactive): every occurrence in this
    # codebase was an idiomatic return@launch/return@withLock/return@withContext-style early exit,
    # not an actual complexity smell, and detekt has no way to scope the check without a blanket
    # exemption list that would also swallow genuinely confusing labels in future code.

coroutines:
    GlobalCoroutineUsage:
        active: true
    SuspendFunSwallowedCancellation:
        active: true
    SuspendFunWithCoroutineScopeReceiver:
        active: true

exceptions:
    NotImplementedDeclaration:
        active: true
    ObjectExtendsThrowable:
        active: true

naming:
    FunctionNaming:
        ignoreAnnotated: ['Composable']

potential-bugs:
    CastToNullableType:
        active: true
    CastNullableToNonNullableType:
        active: true
    DontDowncastCollectionTypes:
        active: true
    ElseCaseInsteadOfExhaustiveWhen:
        active: true
    ImplicitUnitReturnType:
        active: true
    LateinitUsage:
        active: true
    MissingPackageDeclaration:
        active: true
    NullCheckOnMutableProperty:
        active: true
    NullableToStringCall:
        active: true
    PropertyUsedBeforeDeclaration:
        active: true
    UnconditionalJumpStatementInLoop:
        active: true
    UnnecessaryNotNullCheck:
        active: true
    Deprecation:
        active: true
    ExitOutsideMain:
        active: true

style:
    MaxLineLength:
        active: false
    WildcardImport:
        active: false

    MagicNumber:
        ignorePropertyDeclaration: true
        ignoreLocalVariableDeclaration: true
        ignoreAnnotation: true
        ignoreEnums: true
    ReturnCount:
        max: 3

    UnusedPrivateMember:
        ignoreAnnotated: ['Preview']
    UnusedParameter:
        ignoreAnnotated: ['Preview']
    UnusedPrivateProperty:
        ignoreAnnotated: ['Preview']

    CanBeNonNullable:
        active: true
    ClassOrdering:
        active: true
    CollapsibleIfStatements:
        active: true
    DataClassContainsFunctions:
        active: true
    DataClassShouldBeImmutable:
        active: true
    ForbiddenMethodCall:
        active: true
        methods:
            - 'kotlin.io.println'
            - 'kotlin.io.print'
    MandatoryBracesLoops:
        active: true
    BracesOnIfStatements:
        active: true
        singleLine: 'never'
    BracesOnWhenStatements:
        active: true
        singleLine: 'never'
    MaxChainedCallsOnSameLine:
        active: true
        maxChainedCalls: 5
    NullableBooleanCheck:
        active: true
    RedundantExplicitType:
        active: true
    RedundantVisibilityModifierRule:
        active: true
    UnnecessaryInnerClass:
        active: true
    UnnecessaryLet:
        active: true
    UnnecessaryParentheses:
        active: true
    UseDataClass:
        active: true
    UseIfInsteadOfWhen:
        active: true
    UnderscoresInNumericLiterals:
        active: true
    NoTabs:
        active: true
    UnnecessaryBackticks:
        active: true
    UseCheckOrError:
        active: true
    UseCheckNotNull:
        active: true
    UseEmptyCounterpart:
        active: true
    UseIfEmptyOrIfBlank:
        active: true
    UseAnyOrNoneInsteadOfFind:
        active: true
    UseSumOfInsteadOfFlatMapSize:
        active: true
    DoubleNegativeLambda:
        active: true
    ForbiddenSuppress:
        active: true
        rules:
            - 'UnsafeCallOnNullableType'
            - 'CastNullableToNonNullableType'

Compose:
    ComposableAnnotationNaming:
        active: true
    ComposableNaming:
        active: true
    ComposableParamOrder:
        active: true
    CompositionLocalAllowlist:
        active: true
        allowedCompositionLocals: LocalOverlayColors
    CompositionLocalNaming:
        active: true
    ContentEmitterReturningValues:
        active: true
    ContentTrailingLambda:
        active: true
    ContentSlotReused:
        active: true
    DefaultsVisibility:
        active: true
    LambdaParameterEventTrailing:
        active: true
    LambdaParameterInRestartableEffect:
        active: true
    Material2:
        active: true
    ModifierClickableOrder:
        active: true
    ModifierComposed:
        active: true
    ModifierMissing:
        active: true
    ModifierNaming:
        active: true
    ModifierNotUsedAtRoot:
        active: true
    ModifierReused:
        active: true
    ModifierWithoutDefault:
        active: true
    MultipleEmitters:
        active: true
    MutableParams:
        active: true
    MutableStateAutoboxing:
        active: true
    MutableStateParam:
        active: true
    ParameterNaming:
        active: true
    PreviewAnnotationNaming:
        active: true
    PreviewNaming:
        active: true
    PreviewPublic:
        active: true
    RememberMissing:
        active: true
    RememberContentMissing:
        active: true
    UnstableCollections:
        active: true
    ViewModelForwarding:
        active: true
    ViewModelInjection:
        active: true
