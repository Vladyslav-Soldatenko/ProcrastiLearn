name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Export fixture immutability guard
        run: |
          git fetch origin master
          changed=$(git diff --name-status origin/master...HEAD -- app/src/test/resources/exports/ | grep -v '^A' || true)
          if [ -n "$changed" ]; then
            echo "::error::Export fixtures are append-only — see app/src/test/resources/exports/README.md"
            echo "$changed"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: ktlint
        run: ./gradlew ktlintCheck --no-daemon

      - name: detekt
        run: ./gradlew detekt --no-daemon

      - name: Android Lint
        run: ./gradlew lint --no-daemon

      - name: Dependency analysis
        run: ./gradlew projectHealth --no-daemon

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

      - name: Upload detekt report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-reports
          path: app/build/reports/detekt/

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: app/build/reports/lint-results-debug.html

      - name: Upload dependency analysis report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-analysis-reports
          path: app/build/reports/dependency-analysis/project-health-report.txt
